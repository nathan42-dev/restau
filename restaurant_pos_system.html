
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestoPOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#252525;--bg4:#2e2e2e;
  --txt:#f0ede8;--txt2:#a09a92;--txt3:#6b6560;
  --acc:#e8c547;--acc2:#c9a82d;--red:#e85447;--green:#4caf7d;
  --brd:rgba(255,255,255,0.08);--brd2:rgba(255,255,255,0.15);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--r2:14px;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto}

/* NAV */
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--brd);overflow:hidden}
.nav-btn{flex:1;padding:12px 6px 10px;font-family:var(--font);font-size:11px;font-weight:500;border:none;background:none;color:var(--txt3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .2s;letter-spacing:.3px;text-transform:uppercase}
.nav-btn i{font-size:20px}
.nav-btn.active{color:var(--acc);background:rgba(232,197,71,.06)}
.nav-btn.active .nav-dot{background:var(--acc)}
.nav-dot{width:4px;height:4px;border-radius:50%;background:transparent;transition:all .2s}

/* CONTENT */
.view{display:none;flex:1;flex-direction:column;overflow:hidden}
.view.active{display:flex}

/* === VIEW: COMMANDE === */
.cmd-header{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--brd)}
.table-sel{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.table-sel::-webkit-scrollbar{display:none}
.tbl-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--brd2);background:none;color:var(--txt2);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.tbl-btn.active{background:var(--acc);color:#000;border-color:var(--acc)}
.tbl-badge{background:var(--red);color:#fff;border-radius:50%;font-size:10px;font-weight:600;padding:1px 5px;margin-left:4px;font-family:var(--mono)}

.cmd-body{display:flex;flex:1;overflow:hidden}
.menu-col{flex:1;overflow-y:auto;padding:10px 8px}
.kitchen-col{width:170px;background:var(--bg2);border-left:1px solid var(--brd);display:flex;flex-direction:column;overflow:hidden}
.kitch-title{padding:12px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--txt3);border-bottom:1px solid var(--brd)}
.kitch-list{flex:1;overflow-y:auto;padding:8px}
.kitch-item{margin-bottom:6px;padding:8px 10px;background:var(--bg3);border-radius:var(--r);font-size:12px}
.kitch-item .item-name{color:var(--txt);font-weight:500;margin-bottom:2px}
.kitch-item .item-table{color:var(--txt3);font-size:11px}
.kitch-item .item-qty{font-family:var(--mono);color:var(--acc);font-size:11px;font-weight:600}
.kitch-total{padding:8px 12px;border-top:1px solid var(--brd);font-size:12px;color:var(--txt3)}
.kitch-total span{color:var(--acc);font-weight:600;font-family:var(--mono)}

.cat-label{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--txt3);padding:8px 6px 4px}
.menu-item{display:flex;align-items:center;padding:9px 8px;border-radius:var(--r);cursor:pointer;transition:background .15s;margin-bottom:3px}
.menu-item:hover{background:var(--bg3)}
.menu-item:active{background:var(--bg4)}
.menu-item-info{flex:1}
.menu-item-name{font-size:14px;font-weight:500;color:var(--txt)}
.menu-item-price{font-size:13px;color:var(--acc);font-family:var(--mono);font-weight:500;margin-top:1px}
.menu-item-desc{font-size:11px;color:var(--txt3);margin-top:2px}
.add-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--brd2);background:none;color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0}
.add-btn:hover{background:var(--acc);color:#000;border-color:var(--acc)}
.unavail{opacity:.4;pointer-events:none}

.cmd-footer{background:var(--bg2);border-top:1px solid var(--brd);padding:12px 16px}
.order-preview{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:30px}
.ord-tag{display:flex;align-items:center;gap:5px;background:var(--bg3);border-radius:20px;padding:4px 8px 4px 10px;font-size:12px;font-weight:500}
.ord-tag-qty{color:var(--acc);font-family:var(--mono);font-size:11px;font-weight:600;margin-right:2px}
.ord-tag button{background:none;border:none;color:var(--txt3);cursor:pointer;padding:0;line-height:1;font-size:14px}
.footer-row{display:flex;gap:8px;align-items:center}
.total-badge{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--acc);background:rgba(232,197,71,.1);padding:8px 14px;border-radius:var(--r);border:1px solid rgba(232,197,71,.2)}
.send-btn{flex:1;padding:11px;background:var(--acc);color:#000;border:none;border-radius:var(--r);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.send-btn:hover{background:var(--acc2)}
.send-btn:disabled{opacity:.4;pointer-events:none}
.clear-btn{padding:11px 12px;background:none;border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt2);cursor:pointer;font-size:16px;display:flex;align-items:center}
.clear-btn:hover{background:var(--bg3)}

/* === VIEW: CUISINE === */
.cuis-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--brd)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.cuis-grid{flex:1;overflow-y:auto;padding:12px}
.ticket{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--r2);margin-bottom:10px;overflow:hidden;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.ticket-header{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--brd);gap:8px}
.ticket-table{font-size:18px;font-weight:600;font-family:var(--mono);color:var(--acc)}
.ticket-time{font-size:11px;color:var(--txt3);font-family:var(--mono);margin-left:auto}
.ticket-status{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px}
.st-new{background:rgba(232,84,71,.15);color:var(--red)}
.st-prep{background:rgba(232,197,71,.12);color:var(--acc)}
.st-done{background:rgba(76,175,125,.12);color:var(--green)}
.ticket-items{padding:10px 14px}
.t-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--brd)}
.t-item:last-child{border:none}
.t-item-qty{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--acc);min-width:22px}
.t-item-name{flex:1;font-size:13px;color:var(--txt)}
.t-item-note{font-size:11px;color:var(--txt3);font-style:italic}
.ticket-actions{display:flex;padding:10px 14px;gap:6px}
.tact-btn{flex:1;padding:8px;border-radius:var(--r);border:1px solid var(--brd2);background:none;color:var(--txt2);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;transition:all .2s}
.tact-btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.tact-btn:hover{background:var(--bg3)}
.tact-btn.primary:hover{background:#3d9e6a}
.empty-state{text-align:center;padding:40px 20px;color:var(--txt3)}
.empty-state i{font-size:40px;display:block;margin-bottom:12px;color:var(--bg4)}

/* === VIEW: CARTE === */
.carte-header{padding:14px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between}
.add-cat-btn{padding:7px 12px;background:none;border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt2);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s}
.add-cat-btn:hover{background:var(--bg3);color:var(--txt)}
.carte-scroll{flex:1;overflow-y:auto;padding:10px 12px}
.cat-section{margin-bottom:16px}
.cat-head{display:flex;align-items:center;padding:8px 4px;gap:6px}
.cat-name{font-size:13px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--txt2);flex:1}
.cat-edit-btn{background:none;border:none;color:var(--txt3);cursor:pointer;padding:4px;font-size:16px;display:flex;transition:color .2s}
.cat-edit-btn:hover{color:var(--txt)}
.cat-add-btn{background:none;border:1px dashed var(--brd2);border-radius:var(--r);padding:7px;color:var(--txt3);cursor:pointer;font-size:12px;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:5px;width:100%;margin-top:4px;transition:all .2s}
.cat-add-btn:hover{background:var(--bg3);color:var(--txt2)}
.dish-row{display:flex;align-items:center;padding:9px 8px;border-radius:var(--r);cursor:pointer;transition:background .15s;gap:8px;margin-bottom:2px}
.dish-row:hover{background:var(--bg3)}
.dish-info{flex:1}
.dish-name-edit{font-size:14px;font-weight:500;color:var(--txt)}
.dish-desc-edit{font-size:11px;color:var(--txt3);margin-top:2px}
.dish-price-edit{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--acc);min-width:55px;text-align:right}
.dish-actions{display:flex;gap:4px}
.dish-act-btn{background:none;border:none;color:var(--txt3);cursor:pointer;padding:4px;font-size:15px;display:flex;align-items:center;transition:color .2s;border-radius:6px}
.dish-act-btn:hover{color:var(--txt);background:var(--bg4)}
.dish-act-btn.danger:hover{color:var(--red)}
.dish-act-btn.toggle-off{color:var(--txt3)}
.dish-act-btn.toggle-on{color:var(--green)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border-radius:var(--r2) var(--r2) 0 0;padding:20px 16px 30px;width:100%;max-width:480px;animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(20px)}to{transform:translateY(0)}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-field{margin-bottom:12px}
.modal-field label{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--txt3);display:block;margin-bottom:5px}
.modal-field input,.modal-field textarea,.modal-field select{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt);font-family:var(--font);font-size:14px;outline:none;transition:border .2s}
.modal-field input:focus,.modal-field textarea:focus{border-color:var(--acc)}
.modal-field textarea{resize:vertical;min-height:60px;line-height:1.5}
.modal-row{display:flex;gap:8px}
.modal-row .modal-field{flex:1}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-cancel{flex:1;padding:11px;background:none;border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt2);font-family:var(--font);font-size:14px;cursor:pointer}
.modal-save{flex:2;padding:11px;background:var(--acc);border:none;border-radius:var(--r);color:#000;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer}
.modal-delete{padding:11px;background:none;border:1px solid rgba(232,84,71,.3);border-radius:var(--r);color:var(--red);font-family:var(--font);font-size:14px;cursor:pointer}

.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:200;animation:notif .1s ease;pointer-events:none}
@keyframes notif{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.h2txt{font-size:15px;font-weight:600}
.section-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(232,197,71,.1);color:var(--acc);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px;border:1px solid rgba(232,197,71,.15)}
</style>
</head>
<body>
<div class="app">

<div class="nav">
  <button class="nav-btn active" onclick="showView('commande')" id="nav-commande">
    <i class="ti ti-clipboard-list" aria-hidden="true"></i>Commande
    <div class="nav-dot" id="dot-commande"></div>
  </button>
  <button class="nav-btn" onclick="showView('cuisine')" id="nav-cuisine">
    <i class="ti ti-chef-hat" aria-hidden="true"></i>Cuisine
    <div class="nav-dot" id="dot-cuisine"></div>
  </button>
  <button class="nav-btn" onclick="showView('carte')" id="nav-carte">
    <i class="ti ti-book" aria-hidden="true"></i>Carte
    <div class="nav-dot" id="dot-carte"></div>
  </button>
</div>

<!-- COMMANDE -->
<div class="view active" id="view-commande">
  <div class="cmd-header">
    <span class="h2txt">Prise de commande</span>
    <span class="section-pill" id="active-table-pill"><i class="ti ti-armchair" aria-hidden="true"></i>Table 1</span>
  </div>
  <div class="table-sel" id="table-sel"></div>
  <div class="cmd-body">
    <div class="menu-col" id="menu-col"></div>
    <div class="kitchen-col">
      <div class="kitch-title"><i class="ti ti-fire" aria-hidden="true"></i> En cours</div>
      <div class="kitch-list" id="mini-kitchen"></div>
      <div class="kitch-total">Total: <span id="mini-total">0</span></div>
    </div>
  </div>
  <div class="cmd-footer">
    <div class="order-preview" id="order-preview"></div>
    <div class="footer-row">
      <button class="clear-btn" onclick="clearOrder()" title="Vider"><i class="ti ti-trash" aria-hidden="true"></i></button>
      <div class="total-badge" id="order-total">0,00 €</div>
      <button class="send-btn" id="send-btn" onclick="sendOrder()" disabled>
        <i class="ti ti-send" aria-hidden="true"></i>Envoyer
      </button>
    </div>
  </div>
</div>

<!-- CUISINE -->
<div class="view" id="view-cuisine">
  <div class="cuis-header">
    <span class="h2txt">Cuisine</span>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:12px;color:var(--txt3)">En direct</span>
      <div class="live-dot" title="En direct"></div>
    </div>
  </div>
  <div class="cuis-grid" id="cuis-grid"></div>
</div>

<!-- CARTE -->
<div class="view" id="view-carte">
  <div class="carte-header">
    <span class="h2txt">Gestion de la carte</span>
    <button class="add-cat-btn" onclick="openCatModal()"><i class="ti ti-plus" aria-hidden="true"></i>Catégorie</button>
  </div>
  <div class="carte-scroll" id="carte-scroll"></div>
</div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modal-content">
    <h3 id="modal-title">Modifier</h3>
    <div id="modal-fields"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
const KEY_MENU = 'rpos_menu_v2';
const KEY_ORDERS = 'rpos_orders_v2';

let menuData = {
  categories: [
    { id: 'c1', name: 'Entrées' },
    { id: 'c2', name: 'Plats' },
    { id: 'c3', name: 'Desserts' },
    { id: 'c4', name: 'Boissons' }
  ],
  dishes: [
    { id: 'd1', catId: 'c1', name: 'Soupe du jour', desc: 'Maison', price: 6.5, available: true },
    { id: 'd2', catId: 'c1', name: 'Salade César', desc: 'Croûtons, parmesan', price: 9.0, available: true },
    { id: 'd3', catId: 'c2', name: 'Entrecôte', desc: '200g, sauce maison', price: 22.0, available: true },
    { id: 'd4', catId: 'c2', name: 'Filet de saumon', desc: 'Légumes de saison', price: 18.5, available: true },
    { id: 'd5', catId: 'c2', name: 'Plat végétarien', desc: 'Du marché', price: 14.0, available: true },
    { id: 'd6', catId: 'c3', name: 'Crème brûlée', desc: '', price: 7.0, available: true },
    { id: 'd7', catId: 'c3', name: 'Moelleux chocolat', desc: 'Boule vanille', price: 8.0, available: true },
    { id: 'd8', catId: 'c4', name: 'Carafe d\'eau', desc: '50cl', price: 0, available: true },
    { id: 'd9', catId: 'c4', name: 'Verre de vin', desc: 'Rouge / blanc', price: 5.5, available: true },
    { id: 'd10', catId: 'c4', name: 'Café', desc: '', price: 2.5, available: true },
  ]
};

let orders = [];
let currentOrder = {};
let activeTable = 1;
const TABLES = [1,2,3,4,5,6,7,8];

function loadData() {
  try {
    const m = localStorage.getItem(KEY_MENU);
    if (m) menuData = JSON.parse(m);
    const o = localStorage.getItem(KEY_ORDERS);
    if (o) orders = JSON.parse(o);
  } catch(e) {}
}

function saveMenu() {
  try { localStorage.setItem(KEY_MENU, JSON.stringify(menuData)); } catch(e) {}
}

function saveOrders() {
  try { localStorage.setItem(KEY_ORDERS, JSON.stringify(orders)); } catch(e) {}
}

function uid() { return Math.random().toString(36).substr(2,8); }

function fmt(v) { return v.toFixed(2).replace('.',',') + ' €'; }

function showView(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.getElementById('nav-' + v).classList.add('active');
  if (v === 'cuisine') renderCuisine();
  if (v === 'carte') renderCarte();
  if (v === 'commande') renderMenu();
}

// ===== COMMANDE =====
function renderTableSel() {
  const el = document.getElementById('table-sel');
  el.innerHTML = TABLES.map(t => {
    const hasOrders = orders.filter(o => o.table === t && o.status !== 'done').length;
    return `<button class="tbl-btn${t === activeTable ? ' active' : ''}" onclick="selectTable(${t})">
      Table ${t}${hasOrders ? `<span class="tbl-badge">${hasOrders}</span>` : ''}
    </button>`;
  }).join('');
}

function selectTable(t) {
  activeTable = t;
  currentOrder = {};
  document.getElementById('active-table-pill').innerHTML = `<i class="ti ti-armchair" aria-hidden="true"></i> Table ${t}`;
  renderTableSel();
  renderMenu();
  renderOrderPreview();
  renderMiniKitchen();
}

function renderMenu() {
  renderTableSel();
  const el = document.getElementById('menu-col');
  let html = '';
  menuData.categories.forEach(cat => {
    const dishes = menuData.dishes.filter(d => d.catId === cat.id);
    if (!dishes.length) return;
    html += `<div class="cat-label">${cat.name}</div>`;
    dishes.forEach(d => {
      html += `<div class="menu-item${d.available ? '' : ' unavail'}" onclick="addItem('${d.id}')">
        <div class="menu-item-info">
          <div class="menu-item-name">${d.name}</div>
          ${d.desc ? `<div class="menu-item-desc">${d.desc}</div>` : ''}
          <div class="menu-item-price">${d.price === 0 ? 'Offert' : fmt(d.price)}</div>
        </div>
        <button class="add-btn" aria-label="Ajouter ${d.name}">+</button>
      </div>`;
    });
  });
  el.innerHTML = html;
}

function addItem(id) {
  currentOrder[id] = (currentOrder[id] || 0) + 1;
  renderOrderPreview();
  renderMiniKitchen();
  const d = menuData.dishes.find(x => x.id === id);
  showNotif(`+ ${d.name}`);
}

function removeItem(id) {
  if (currentOrder[id] > 1) currentOrder[id]--;
  else delete currentOrder[id];
  renderOrderPreview();
  renderMiniKitchen();
}

function clearOrder() {
  currentOrder = {};
  renderOrderPreview();
  renderMiniKitchen();
}

function renderOrderPreview() {
  const el = document.getElementById('order-preview');
  const btn = document.getElementById('send-btn');
  const totalEl = document.getElementById('order-total');
  const items = Object.entries(currentOrder);
  let total = 0;
  let html = '';
  items.forEach(([id, qty]) => {
    const d = menuData.dishes.find(x => x.id === id);
    if (!d) return;
    total += d.price * qty;
    html += `<div class="ord-tag">
      <span class="ord-tag-qty">${qty}x</span>${d.name}
      <button onclick="removeItem('${id}')" aria-label="Retirer">×</button>
    </div>`;
  });
  el.innerHTML = html;
  totalEl.textContent = fmt(total);
  btn.disabled = items.length === 0;
}

function renderMiniKitchen() {
  const el = document.getElementById('mini-kitchen');
  const totalEl = document.getElementById('mini-total');
  const active = orders.filter(o => o.table === activeTable && o.status !== 'done');
  let html = '';
  let count = 0;
  active.forEach(ord => {
    ord.items.forEach(it => {
      count++;
      html += `<div class="kitch-item">
        <div class="item-name">${it.name}</div>
        <div class="item-qty">${it.qty}x</div>
      </div>`;
    });
  });
  el.innerHTML = html || '<div style="padding:8px;font-size:11px;color:var(--txt3)">Aucune commande</div>';
  totalEl.textContent = count;
}

function sendOrder() {
  const items = Object.entries(currentOrder).map(([id, qty]) => {
    const d = menuData.dishes.find(x => x.id === id);
    return { id, name: d.name, qty, price: d.price };
  });
  const order = {
    id: uid(),
    table: activeTable,
    items,
    status: 'new',
    time: new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }),
    ts: Date.now()
  };
  orders.unshift(order);
  saveOrders();
  currentOrder = {};
  renderOrderPreview();
  renderMiniKitchen();
  renderTableSel();
  showNotif('Commande envoyée !');
}

// ===== CUISINE =====
function renderCuisine() {
  const el = document.getElementById('cuis-grid');
  const active = orders.filter(o => o.status !== 'done');
  if (!active.length) {
    el.innerHTML = `<div class="empty-state"><i class="ti ti-chef-hat" aria-hidden="true"></i><br>Aucune commande en cours</div>`;
    return;
  }
  el.innerHTML = active.map(ord => {
    const stClass = {new:'st-new',prep:'st-prep',done:'st-done'}[ord.status];
    const stLabel = {new:'Nouveau',prep:'En préparation',done:'Servi'}[ord.status];
    return `<div class="ticket" id="ticket-${ord.id}">
      <div class="ticket-header">
        <span class="ticket-table">T${ord.table}</span>
        <span class="ticket-status ${stClass}">${stLabel}</span>
        <span class="ticket-time">${ord.time}</span>
      </div>
      <div class="ticket-items">
        ${ord.items.map(it => `<div class="t-item">
          <span class="t-item-qty">${it.qty}</span>
          <span class="t-item-name">${it.name}</span>
        </div>`).join('')}
      </div>
      <div class="ticket-actions">
        ${ord.status === 'new' ? `<button class="tact-btn primary" onclick="updateOrderStatus('${ord.id}','prep')"><i class="ti ti-flame" aria-hidden="true"></i> En cuisine</button>` : ''}
        ${ord.status === 'prep' ? `<button class="tact-btn primary" onclick="updateOrderStatus('${ord.id}','done')"><i class="ti ti-check" aria-hidden="true"></i> Servi</button>` : ''}
        <button class="tact-btn" onclick="updateOrderStatus('${ord.id}','done')"><i class="ti ti-x" aria-hidden="true"></i> Annuler</button>
      </div>
    </div>`;
  }).join('');
}

function updateOrderStatus(id, status) {
  const o = orders.find(x => x.id === id);
  if (o) { o.status = status; saveOrders(); renderCuisine(); renderMiniKitchen(); renderTableSel(); }
}

// ===== CARTE =====
function renderCarte() {
  const el = document.getElementById('carte-scroll');
  let html = '';
  menuData.categories.forEach(cat => {
    const dishes = menuData.dishes.filter(d => d.catId === cat.id);
    html += `<div class="cat-section">
      <div class="cat-head">
        <span class="cat-name">${cat.name}</span>
        <button class="cat-edit-btn" onclick="openCatModal('${cat.id}')" title="Modifier" aria-label="Modifier catégorie ${cat.name}"><i class="ti ti-edit" aria-hidden="true"></i></button>
        <button class="cat-edit-btn danger" onclick="deleteCategory('${cat.id}')" title="Supprimer" aria-label="Supprimer catégorie" style="color:var(--txt3)"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
      ${dishes.map(d => `<div class="dish-row">
        <div class="dish-info">
          <div class="dish-name-edit">${d.name}</div>
          ${d.desc ? `<div class="dish-desc-edit">${d.desc}</div>` : ''}
        </div>
        <div class="dish-price-edit">${fmt(d.price)}</div>
        <div class="dish-actions">
          <button class="dish-act-btn ${d.available ? 'toggle-on' : 'toggle-off'}" onclick="toggleDish('${d.id}')" title="${d.available ? 'Disponible' : 'Indisponible'}" aria-label="Disponibilité">
            <i class="ti ${d.available ? 'ti-eye' : 'ti-eye-off'}" aria-hidden="true"></i>
          </button>
          <button class="dish-act-btn" onclick="openDishModal('${d.id}')" title="Modifier" aria-label="Modifier plat"><i class="ti ti-pencil" aria-hidden="true"></i></button>
          <button class="dish-act-btn danger" onclick="deleteDish('${d.id}')" title="Supprimer" aria-label="Supprimer plat"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
      </div>`).join('')}
      <button class="cat-add-btn" onclick="openDishModal(null,'${cat.id}')"><i class="ti ti-plus" aria-hidden="true"></i> Ajouter un plat</button>
    </div>`;
  });
  el.innerHTML = html;
}

function toggleDish(id) {
  const d = menuData.dishes.find(x => x.id === id);
  if (d) { d.available = !d.available; saveMenu(); renderCarte(); renderMenu(); showNotif(d.available ? 'Plat disponible' : 'Plat masqué'); }
}

function deleteDish(id) {
  if (!confirm('Supprimer ce plat ?')) return;
  menuData.dishes = menuData.dishes.filter(x => x.id !== id);
  saveMenu(); renderCarte(); renderMenu();
}

function deleteCategory(id) {
  if (!confirm('Supprimer cette catégorie et tous ses plats ?')) return;
  menuData.categories = menuData.categories.filter(x => x.id !== id);
  menuData.dishes = menuData.dishes.filter(x => x.catId !== id);
  saveMenu(); renderCarte(); renderMenu();
}

// ===== MODALS =====
function openDishModal(dishId, defCatId) {
  const d = dishId ? menuData.dishes.find(x => x.id === dishId) : null;
  const catOptions = menuData.categories.map(c => `<option value="${c.id}" ${(d ? d.catId : defCatId) === c.id ? 'selected' : ''}>${c.name}</option>`).join('');
  document.getElementById('modal-title').textContent = d ? 'Modifier le plat' : 'Nouveau plat';
  document.getElementById('modal-fields').innerHTML = `
    <div class="modal-field"><label>Nom</label><input id="mf-name" value="${d ? d.name : ''}" placeholder="Nom du plat"></div>
    <div class="modal-field"><label>Description</label><textarea id="mf-desc" placeholder="Ingrédients, précisions...">${d ? d.desc : ''}</textarea></div>
    <div class="modal-row">
      <div class="modal-field"><label>Prix (€)</label><input id="mf-price" type="number" step="0.5" min="0" value="${d ? d.price : ''}"></div>
      <div class="modal-field"><label>Catégorie</label><select id="mf-cat">${catOptions}</select></div>
    </div>`;
  document.getElementById('modal-actions').innerHTML = `
    ${d ? `<button class="modal-delete" onclick="deleteDish('${d.id}');closeModal()">Supprimer</button>` : ''}
    <button class="modal-cancel" onclick="closeModal()">Annuler</button>
    <button class="modal-save" onclick="saveDish('${dishId || ''}')">Enregistrer</button>`;
  document.getElementById('modal-bg').style.display = 'flex';
}

function saveDish(id) {
  const name = document.getElementById('mf-name').value.trim();
  const desc = document.getElementById('mf-desc').value.trim();
  const price = parseFloat(document.getElementById('mf-price').value) || 0;
  const catId = document.getElementById('mf-cat').value;
  if (!name) { showNotif('Nom requis'); return; }
  if (id) {
    const d = menuData.dishes.find(x => x.id === id);
    Object.assign(d, { name, desc, price, catId });
  } else {
    menuData.dishes.push({ id: uid(), catId, name, desc, price, available: true });
  }
  saveMenu(); closeModal(); renderCarte(); renderMenu(); showNotif('Sauvegardé');
}

function openCatModal(catId) {
  const c = catId ? menuData.categories.find(x => x.id === catId) : null;
  document.getElementById('modal-title').textContent = c ? 'Modifier la catégorie' : 'Nouvelle catégorie';
  document.getElementById('modal-fields').innerHTML = `<div class="modal-field"><label>Nom</label><input id="mf-catname" value="${c ? c.name : ''}" placeholder="Entrées, Plats..."></div>`;
  document.getElementById('modal-actions').innerHTML = `
    ${c ? `<button class="modal-delete" onclick="deleteCategory('${c.id}');closeModal()">Supprimer</button>` : ''}
    <button class="modal-cancel" onclick="closeModal()">Annuler</button>
    <button class="modal-save" onclick="saveCat('${catId || ''}')">Enregistrer</button>`;
  document.getElementById('modal-bg').style.display = 'flex';
}

function saveCat(id) {
  const name = document.getElementById('mf-catname').value.trim();
  if (!name) { showNotif('Nom requis'); return; }
  if (id) menuData.categories.find(x => x.id === id).name = name;
  else menuData.categories.push({ id: uid(), name });
  saveMenu(); closeModal(); renderCarte(); renderMenu(); showNotif('Sauvegardé');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-bg')) return;
  document.getElementById('modal-bg').style.display = 'none';
}

// ===== NOTIF =====
let notifTimer;
function showNotif(msg) {
  const existing = document.querySelector('.notif');
  if (existing) existing.remove();
  clearTimeout(notifTimer);
  const el = document.createElement('div');
  el.className = 'notif';
  el.textContent = msg;
  document.body.appendChild(el);
  notifTimer = setTimeout(() => el.remove(), 1800);
}

// ===== INIT =====
loadData();
renderTableSel();
renderMenu();
renderOrderPreview();
renderMiniKitchen();

// Auto-refresh cuisine toutes les 5s
setInterval(() => {
  const v = document.getElementById('view-cuisine');
  if (v.classList.contains('active')) renderCuisine();
}, 5000);
</script>
</body>
</html>
