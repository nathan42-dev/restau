<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestoPOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#252525;--bg4:#2e2e2e;
  --txt:#f0ede8;--txt2:#a09a92;--txt3:#6b6560;
  --acc:#e8c547;--acc2:#c9a82d;--red:#e85447;--green:#4caf7d;--orange:#f0843a;
  --brd:rgba(255,255,255,0.08);--brd2:rgba(255,255,255,0.15);
  --font:'DM Sans',sans-serif;--mono:'DM Mono',monospace;
  --r:10px;--r2:14px;
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto}

/* MODE TV */
body.tv-mode,body.tv-mode html{width:100%;height:100%}
body.tv-mode .app{max-width:100% !important;width:100% !important;margin:0 !important;height:100vh;overflow:hidden}
body.tv-mode .nav{display:none !important}
body.tv-mode #view-commande,body.tv-mode #view-carte{display:none !important}
body.tv-mode #view-cuisine{display:flex !important;flex:1;height:calc(100vh - 0px);overflow:hidden}
body.tv-mode .cuis-header{padding:20px 40px;flex-shrink:0}
body.tv-mode .cuis-header .h2txt{font-size:30px}
body.tv-mode .stat-box{padding:10px 24px}
body.tv-mode .stat-num{font-size:44px}
body.tv-mode .stat-lbl{font-size:13px}
body.tv-mode #clock{font-size:32px}
body.tv-mode .live-dot{width:14px;height:14px}
body.tv-mode .cuis-grid{grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:20px;padding:24px;overflow-y:auto;align-content:start}
body.tv-mode .ticket-header{padding:20px 26px}
body.tv-mode .table-num{font-size:68px !important}
body.tv-mode .ticket-item-qty{font-size:48px !important;min-width:58px !important}
body.tv-mode .ticket-item-name{font-size:32px !important}
body.tv-mode .ticket-items-wrap{padding:16px 26px}
body.tv-mode .t-row{padding:12px 0 !important}
body.tv-mode .tact-btn{padding:20px !important;font-size:20px !important}
body.tv-mode .ticket-status-badge{font-size:16px !important;padding:5px 14px !important}
body.tv-mode .ticket-elapsed{font-size:40px !important}
body.tv-mode .ticket-time{font-size:15px !important}
body.tv-mode .empty-state i{font-size:120px}
body.tv-mode .empty-state span{font-size:36px}

/* NAV */
.nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--brd);overflow:hidden}
.nav-btn{flex:1;padding:12px 6px 10px;font-family:var(--font);font-size:11px;font-weight:500;border:none;background:none;color:var(--txt3);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:all .2s;letter-spacing:.3px;text-transform:uppercase}
.nav-btn i{font-size:20px}
.nav-btn.active{color:var(--acc);background:rgba(232,197,71,.06)}
.nav-dot{width:4px;height:4px;border-radius:50%;background:transparent;transition:all .2s}

/* VIEWS */
.view{display:none;flex:1;flex-direction:column;overflow:hidden}
.view.active{display:flex}

/* COMMANDE */
.cmd-header{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--brd)}
.table-sel{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.table-sel::-webkit-scrollbar{display:none}
.tbl-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--brd2);background:none;color:var(--txt2);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:all .2s}
.tbl-btn.active{background:var(--acc);color:#000;border-color:var(--acc)}
.tbl-badge{background:var(--red);color:#fff;border-radius:50%;font-size:10px;font-weight:600;padding:1px 5px;margin-left:4px;font-family:var(--mono)}
.cmd-body{display:flex;flex:1;overflow:hidden}
.menu-col{flex:1;overflow-y:auto;padding:10px 8px}
.kitchen-col{width:170px;background:var(--bg2);border-left:1px solid var(--brd);display:flex;flex-direction:column;overflow:hidden}
.kitch-title{padding:12px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--txt3);border-bottom:1px solid var(--brd)}
.kitch-list{flex:1;overflow-y:auto;padding:8px}
.kitch-item{margin-bottom:6px;padding:8px 10px;background:var(--bg3);border-radius:var(--r);font-size:12px}
.kitch-item .item-name{color:var(--txt);font-weight:500;margin-bottom:2px}
.kitch-item .item-qty{font-family:var(--mono);color:var(--acc);font-size:11px;font-weight:600}
.kitch-total{padding:8px 12px;border-top:1px solid var(--brd);font-size:12px;color:var(--txt3)}
.kitch-total span{color:var(--acc);font-weight:600;font-family:var(--mono)}
.cat-label{font-size:10px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--txt3);padding:8px 6px 4px}
.menu-item{display:flex;align-items:center;padding:9px 8px;border-radius:var(--r);cursor:pointer;transition:background .15s;margin-bottom:3px}
.menu-item:hover{background:var(--bg3)}
.menu-item:active{background:var(--bg4)}
.menu-item-info{flex:1}
.menu-item-name{font-size:14px;font-weight:500;color:var(--txt)}
.menu-item-price{font-size:13px;color:var(--acc);font-family:var(--mono);font-weight:500;margin-top:1px}
.menu-item-desc{font-size:11px;color:var(--txt3);margin-top:2px}
.add-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--brd2);background:none;color:var(--txt);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s;flex-shrink:0}
.add-btn:hover{background:var(--acc);color:#000;border-color:var(--acc)}
.unavail{opacity:.4;pointer-events:none}
.cmd-footer{background:var(--bg2);border-top:1px solid var(--brd);padding:12px 16px}
.order-preview{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:30px}
.ord-tag{display:flex;align-items:center;gap:5px;background:var(--bg3);border-radius:20px;padding:4px 8px 4px 10px;font-size:12px;font-weight:500}
.ord-tag-qty{color:var(--acc);font-family:var(--mono);font-size:11px;font-weight:600;margin-right:2px}
.ord-tag button{background:none;border:none;color:var(--txt3);cursor:pointer;padding:0;line-height:1;font-size:14px}
.footer-row{display:flex;gap:8px;align-items:center}
.total-badge{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--acc);background:rgba(232,197,71,.1);padding:8px 14px;border-radius:var(--r);border:1px solid rgba(232,197,71,.2)}
.send-btn{flex:1;padding:11px;background:var(--acc);color:#000;border:none;border-radius:var(--r);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
.send-btn:hover{background:var(--acc2)}
.send-btn:disabled{opacity:.4;pointer-events:none}
.clear-btn{padding:11px 12px;background:none;border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt2);cursor:pointer;font-size:16px;display:flex;align-items:center}
.clear-btn:hover{background:var(--bg3)}

/* CUISINE TV */
.cuis-header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;background:var(--bg2);border-bottom:1px solid var(--brd)}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stat-box{text-align:center;background:var(--bg3);border-radius:10px;padding:8px 16px}
.stat-num{font-size:28px;font-weight:700;font-family:var(--mono);line-height:1}
.stat-lbl{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.cuis-grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;padding:20px;align-content:start;overflow-y:auto}
.ticket{background:var(--bg2);border-radius:var(--r2);overflow:hidden;animation:slideIn .25s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes urgpulse{0%,100%{border-color:#e85447}50%{border-color:rgba(232,84,71,.25)}}
.ticket-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--brd)}
.ticket-actions{display:flex;border-top:1px solid var(--brd)}
.tact-btn{flex:1;padding:16px;background:none;border:none;border-right:1px solid var(--brd);color:var(--txt2);font-family:var(--font);font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s}
.tact-btn:last-child{border-right:none}
.tact-btn.prep:hover{background:rgba(240,132,58,.1);color:var(--orange)}
.tact-btn.done:hover{background:rgba(76,175,125,.1);color:var(--green)}
.tact-btn.cancel:hover{background:rgba(232,84,71,.08);color:var(--red)}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--bg4)}
.empty-state i{font-size:80px}
.empty-state span{font-size:24px;font-weight:600;color:var(--bg4)}

/* CARTE */
.carte-header{padding:14px 16px;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between}
.add-cat-btn{padding:7px 12px;background:none;border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt2);font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;transition:all .2s}
.add-cat-btn:hover{background:var(--bg3);color:var(--txt)}
.carte-scroll{flex:1;overflow-y:auto;padding:10px 12px}
.cat-section{margin-bottom:16px}
.cat-head{display:flex;align-items:center;padding:8px 4px;gap:6px}
.cat-name{font-size:13px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--txt2);flex:1}
.cat-edit-btn{background:none;border:none;color:var(--txt3);cursor:pointer;padding:4px;font-size:16px;display:flex;transition:color .2s;border-radius:6px}
.cat-edit-btn:hover{color:var(--txt);background:var(--bg3)}
.cat-add-btn{background:none;border:1px dashed var(--brd2);border-radius:var(--r);padding:7px;color:var(--txt3);cursor:pointer;font-size:12px;font-family:var(--font);display:flex;align-items:center;justify-content:center;gap:5px;width:100%;margin-top:4px;transition:all .2s}
.cat-add-btn:hover{background:var(--bg3);color:var(--txt2)}
.dish-row{display:flex;align-items:center;padding:9px 8px;border-radius:var(--r);cursor:pointer;transition:background .15s;gap:8px;margin-bottom:2px}
.dish-row:hover{background:var(--bg3)}
.dish-info{flex:1}
.dish-name-txt{font-size:14px;font-weight:500;color:var(--txt)}
.dish-desc-txt{font-size:11px;color:var(--txt3);margin-top:2px}
.dish-price-txt{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--acc);min-width:55px;text-align:right}
.dish-actions{display:flex;gap:4px}
.dish-act-btn{background:none;border:none;color:var(--txt3);cursor:pointer;padding:4px;font-size:15px;display:flex;align-items:center;transition:color .2s;border-radius:6px}
.dish-act-btn:hover{color:var(--txt);background:var(--bg4)}
.dish-act-btn.danger:hover{color:var(--red)}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadein .2s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg2);border-radius:var(--r2) var(--r2) 0 0;padding:20px 16px 32px;width:100%;max-width:480px;animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(20px)}to{transform:translateY(0)}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:16px}
.modal-field{margin-bottom:12px}
.modal-field label{font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--txt3);display:block;margin-bottom:5px}
.modal-field input,.modal-field textarea,.modal-field select{width:100%;padding:10px 12px;background:var(--bg3);border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt);font-family:var(--font);font-size:14px;outline:none;transition:border .2s}
.modal-field input:focus,.modal-field textarea:focus{border-color:var(--acc)}
.modal-field textarea{resize:vertical;min-height:60px;line-height:1.5}
.modal-row{display:flex;gap:8px}
.modal-row .modal-field{flex:1}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-cancel{flex:1;padding:11px;background:none;border:1px solid var(--brd2);border-radius:var(--r);color:var(--txt2);font-family:var(--font);font-size:14px;cursor:pointer}
.modal-save{flex:2;padding:11px;background:var(--acc);border:none;border-radius:var(--r);color:#000;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer}
.modal-delete{padding:11px;background:none;border:1px solid rgba(232,84,71,.3);border-radius:var(--r);color:var(--red);font-family:var(--font);font-size:14px;cursor:pointer}

/* LOADER */
.loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:200}
.loader-spin{width:36px;height:36px;border:3px solid var(--bg3);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:14px;color:var(--txt3)}

/* NOTIF */
.notif{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;z-index:300;pointer-events:none;white-space:nowrap}

.h2txt{font-size:15px;font-weight:600}
.section-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(232,197,71,.1);color:var(--acc);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.3px;border:1px solid rgba(232,197,71,.15)}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-spin"></div>
  <p>Connexion en cours…</p>
</div>

<div class="app" id="app" style="display:none">

  <div class="nav">
    <button class="nav-btn active" onclick="showView('commande')" id="nav-commande">
      <i class="ti ti-clipboard-list" aria-hidden="true"></i>Commande
      <div class="nav-dot"></div>
    </button>
    <button class="nav-btn" onclick="showView('cuisine')" id="nav-cuisine">
      <i class="ti ti-chef-hat" aria-hidden="true"></i>Cuisine
      <div class="nav-dot"></div>
    </button>
    <button class="nav-btn" onclick="showView('carte')" id="nav-carte">
      <i class="ti ti-book" aria-hidden="true"></i>Carte
      <div class="nav-dot"></div>
    </button>
  </div>

  <!-- COMMANDE -->
  <div class="view active" id="view-commande">
    <div class="cmd-header">
      <span class="h2txt">Prise de commande</span>
      <span class="section-pill" id="active-table-pill"><i class="ti ti-armchair" aria-hidden="true"></i> Table 1</span>
    </div>
    <div class="table-sel" id="table-sel"></div>
    <div class="cmd-body">
      <div class="menu-col" id="menu-col"></div>
      <div class="kitchen-col">
        <div class="kitch-title"><i class="ti ti-fire" aria-hidden="true"></i> En cours</div>
        <div class="kitch-list" id="mini-kitchen"></div>
        <div class="kitch-total">Total: <span id="mini-total">0</span></div>
      </div>
    </div>
    <div class="cmd-footer">
      <div class="order-preview" id="order-preview"></div>
      <div class="footer-row">
        <button class="clear-btn" onclick="clearOrder()" title="Vider"><i class="ti ti-trash" aria-hidden="true"></i></button>
        <div class="total-badge" id="order-total">0,00 €</div>
        <button class="send-btn" id="send-btn" onclick="sendOrder()" disabled>
          <i class="ti ti-send" aria-hidden="true"></i>Envoyer
        </button>
      </div>
    </div>
  </div>

  <!-- CUISINE -->
  <div class="view" id="view-cuisine" style="background:var(--bg)">
    <div class="cuis-header">
      <div style="display:flex;align-items:center;gap:14px">
        <i class="ti ti-chef-hat" style="font-size:26px;color:var(--acc)" aria-hidden="true"></i>
        <span class="h2txt">Cuisine</span>
      </div>
      <div style="display:flex;align-items:center;gap:20px">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="live-dot"></div>
          <span style="font-size:13px;color:var(--txt3)">En direct</span>
        </div>
        <div id="clock" style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--acc)"></div>
        <div style="display:flex;gap:8px">
          <div class="stat-box"><div class="stat-num" id="stat-new" style="color:var(--red)">0</div><div class="stat-lbl">Nouveaux</div></div>
          <div class="stat-box"><div class="stat-num" id="stat-prep" style="color:var(--orange)">0</div><div class="stat-lbl">En cuisine</div></div>
          <div class="stat-box"><div class="stat-num" id="stat-done" style="color:var(--green)">0</div><div class="stat-lbl">Servis</div></div>
        </div>
      </div>
    </div>
    <div class="cuis-grid" id="cuis-grid"></div>
    <div class="empty-state" id="cuis-empty" style="display:none">
      <i class="ti ti-chef-hat" aria-hidden="true"></i>
      <span>Aucune commande en cours</span>
    </div>
  </div>

  <!-- CARTE -->
  <div class="view" id="view-carte">
    <div class="carte-header">
      <span class="h2txt">Gestion de la carte</span>
      <button class="add-cat-btn" onclick="openCatModal()"><i class="ti ti-plus" aria-hidden="true"></i>Catégorie</button>
    </div>
    <div class="carte-scroll" id="carte-scroll"></div>
  </div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" style="display:none" onclick="closeModalBg(event)">
  <div class="modal">
    <h3 id="modal-title">Modifier</h3>
    <div id="modal-fields"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, push, update, remove, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7GhYVm362s4W5fNPrVqLHL1eIaH-eRuM",
  authDomain: "restau-54f67.firebaseapp.com",
  databaseURL: "https://restau-54f67-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "restau-54f67",
  storageBucket: "restau-54f67.firebasestorage.app",
  messagingSenderId: "111966493521",
  appId: "1:111966493521:web:8913570a068732d5971170"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEFAULT_MENU = {
  categories: {
    c1: { name: 'Entrées', order: 0 },
    c2: { name: 'Plats', order: 1 },
    c3: { name: 'Desserts', order: 2 },
    c4: { name: 'Boissons', order: 3 }
  },
  dishes: {
    d1: { catId:'c1', name:'Soupe du jour', desc:'Maison', price:6.5, available:true },
    d2: { catId:'c1', name:'Salade César', desc:'Croûtons, parmesan', price:9.0, available:true },
    d3: { catId:'c2', name:'Entrecôte', desc:'200g, sauce maison', price:22.0, available:true },
    d4: { catId:'c2', name:'Filet de saumon', desc:'Légumes de saison', price:18.5, available:true },
    d5: { catId:'c2', name:'Plat végétarien', desc:'Du marché', price:14.0, available:true },
    d6: { catId:'c3', name:'Crème brûlée', desc:'', price:7.0, available:true },
    d7: { catId:'c3', name:'Moelleux chocolat', desc:'Boule vanille', price:8.0, available:true },
    d8: { catId:'c4', name:"Carafe d'eau", desc:'50cl', price:0, available:true },
    d9: { catId:'c4', name:'Verre de vin', desc:'Rouge / blanc', price:5.5, available:true },
    d10:{ catId:'c4', name:'Café', desc:'', price:2.5, available:true }
  }
};

// State
let menuData = { categories: {}, dishes: {} };
let orders = {};
let currentOrder = {};
let activeTable = 1;
const TABLES = [1,2,3,4,5,6,7,8];

function uid() { return Math.random().toString(36).substr(2,8); }
function fmt(v) { return Number(v).toFixed(2).replace('.',',') + ' €'; }

// ---- Init ----
async function init() {
  const menuSnap = await get(ref(db, 'menu'));
  if (!menuSnap.exists()) {
    await set(ref(db, 'menu'), DEFAULT_MENU);
  }

  // Live listeners
  onValue(ref(db, 'menu'), snap => {
    menuData = snap.val() || { categories:{}, dishes:{} };
    if (!menuData.categories) menuData.categories = {};
    if (!menuData.dishes) menuData.dishes = {};
    renderMenu();
    renderCarte();
  });

  onValue(ref(db, 'orders'), snap => {
    orders = snap.val() || {};
    renderMenu();
    renderMiniKitchen();
    renderTableSel();
    renderCuisine();
  });

  document.getElementById('loader').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  renderTableSel();
  renderMenu();
  setInterval(clock, 1000);
  clock();
}

// ---- VIEWS ----
window.showView = function(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  document.getElementById('nav-' + v).classList.add('active');
};

// ---- COMMANDE ----
function renderTableSel() {
  const el = document.getElementById('table-sel');
  el.innerHTML = TABLES.map(t => {
    const count = Object.values(orders).filter(o => o.table === t && o.status !== 'done').length;
    return `<button class="tbl-btn${t === activeTable ? ' active' : ''}" onclick="selectTable(${t})">
      Table ${t}${count ? `<span class="tbl-badge">${count}</span>` : ''}
    </button>`;
  }).join('');
}

window.selectTable = function(t) {
  activeTable = t;
  currentOrder = {};
  document.getElementById('active-table-pill').innerHTML = `<i class="ti ti-armchair" aria-hidden="true"></i> Table ${t}`;
  renderTableSel();
  renderMenu();
  renderOrderPreview();
  renderMiniKitchen();
};

function renderMenu() {
  renderTableSel();
  const el = document.getElementById('menu-col');
  if (!menuData.categories) { el.innerHTML = ''; return; }
  const cats = Object.entries(menuData.categories).sort((a,b) => (a[1].order||0)-(b[1].order||0));
  let html = '';
  cats.forEach(([cid, cat]) => {
    const dishes = Object.entries(menuData.dishes || {}).filter(([,d]) => d.catId === cid);
    if (!dishes.length) return;
    html += `<div class="cat-label">${cat.name}</div>`;
    dishes.forEach(([did, d]) => {
      html += `<div class="menu-item${d.available ? '' : ' unavail'}" onclick="addItem('${did}')">
        <div class="menu-item-info">
          <div class="menu-item-name">${d.name}</div>
          ${d.desc ? `<div class="menu-item-desc">${d.desc}</div>` : ''}
          <div class="menu-item-price">${d.price === 0 ? 'Offert' : fmt(d.price)}</div>
        </div>
        <button class="add-btn" aria-label="Ajouter ${d.name}">+</button>
      </div>`;
    });
  });
  el.innerHTML = html;
}

window.addItem = function(id) {
  currentOrder[id] = (currentOrder[id] || 0) + 1;
  renderOrderPreview();
  renderMiniKitchen();
  const d = menuData.dishes[id];
  if (d) showNotif(`+ ${d.name}`);
};

window.removeItem = function(id) {
  if (currentOrder[id] > 1) currentOrder[id]--;
  else delete currentOrder[id];
  renderOrderPreview();
  renderMiniKitchen();
};

window.clearOrder = function() {
  currentOrder = {};
  renderOrderPreview();
  renderMiniKitchen();
};

function renderOrderPreview() {
  const el = document.getElementById('order-preview');
  const btn = document.getElementById('send-btn');
  const totalEl = document.getElementById('order-total');
  const items = Object.entries(currentOrder);
  let total = 0;
  let html = '';
  items.forEach(([id, qty]) => {
    const d = menuData.dishes && menuData.dishes[id];
    if (!d) return;
    total += d.price * qty;
    html += `<div class="ord-tag">
      <span class="ord-tag-qty">${qty}x</span>${d.name}
      <button onclick="removeItem('${id}')" aria-label="Retirer">×</button>
    </div>`;
  });
  el.innerHTML = html;
  totalEl.textContent = fmt(total);
  btn.disabled = items.length === 0;
}

function renderMiniKitchen() {
  const el = document.getElementById('mini-kitchen');
  const totalEl = document.getElementById('mini-total');
  const active = Object.values(orders).filter(o => o.table === activeTable && o.status !== 'done');
  let html = '';
  let count = 0;
  active.forEach(ord => {
    (ord.items || []).forEach(it => {
      count++;
      html += `<div class="kitch-item">
        <div class="item-name">${it.name}</div>
        <div class="item-qty">${it.qty}x</div>
      </div>`;
    });
  });
  el.innerHTML = html || '<div style="padding:8px;font-size:11px;color:var(--txt3)">Aucune commande</div>';
  totalEl.textContent = count;
}

window.sendOrder = async function() {
  const items = Object.entries(currentOrder).map(([id, qty]) => {
    const d = menuData.dishes[id];
    return { id, name: d.name, qty, price: d.price };
  });
  const order = {
    table: activeTable,
    items,
    status: 'new',
    time: new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }),
    ts: Date.now()
  };
  await push(ref(db, 'orders'), order);
  currentOrder = {};
  renderOrderPreview();
  showNotif('Commande envoyée !');
};

// ---- CUISINE ----
function timeSince(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's';
  return Math.floor(s / 60) + 'min';
}
function urgencyColor(ts, status) {
  if (status === 'done') return 'var(--green)';
  if (status === 'prep') return 'var(--orange)';
  const min = (Date.now() - ts) / 60000;
  if (min > 15) return 'var(--red)';
  if (min > 8) return 'var(--orange)';
  return 'var(--acc)';
}

function renderCuisine() {
  const grid = document.getElementById('cuis-grid');
  const empty = document.getElementById('cuis-empty');
  const active = Object.entries(orders).filter(([,o]) => o.status !== 'done');

  const allOrders = Object.values(orders);
  document.getElementById('stat-new').textContent = allOrders.filter(o=>o.status==='new').length;
  document.getElementById('stat-prep').textContent = allOrders.filter(o=>o.status==='prep').length;
  document.getElementById('stat-done').textContent = allOrders.filter(o=>o.status==='done').length;

  if (!active.length) {
    grid.style.display = 'none';
    empty.style.display = 'flex';
    return;
  }
  grid.style.display = 'grid';
  empty.style.display = 'none';

  const sorted = [...active].sort(([,a],[,b]) => {
    const sp = {new:0,prep:1};
    return (sp[a.status]||2)-(sp[b.status]||2) || a.ts-b.ts;
  });

  const stLabel = {new:'Nouveau',prep:'En cuisine',done:'Servi'};
  const stColor = {new:'var(--red)',prep:'var(--orange)',done:'var(--green)'};

  grid.innerHTML = sorted.map(([oid, ord]) => {
    const uc = urgencyColor(ord.ts, ord.status);
    const isUrgent = ord.status==='new' && (Date.now()-ord.ts)/60000>8;
    return `<div style="background:var(--bg2);border:2px solid ${uc};border-radius:var(--r2);overflow:hidden;${isUrgent?'animation:urgpulse 1.5s infinite':''}">
      <div class="ticket-header">
        <div style="display:flex;align-items:center;gap:12px">
          <span class="table-num" style="font-size:44px;font-weight:700;font-family:var(--mono);color:${uc};line-height:1">T${ord.table}</span>
          <div>
            <div style="font-size:12px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px">Table</div>
            <div class="ticket-status-badge" style="display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.05);border-radius:6px;padding:3px 9px;margin-top:4px">
              <span style="width:7px;height:7px;border-radius:50%;background:${stColor[ord.status]};display:inline-block"></span>
              <span style="font-weight:600;color:${stColor[ord.status]}">${stLabel[ord.status]}</span>
            </div>
          </div>
        </div>
        <div style="text-align:right">
          <div class="ticket-elapsed" style="font-size:28px;font-weight:700;font-family:var(--mono);color:${isUrgent?'var(--red)':'var(--txt3)'}">${timeSince(ord.ts)}</div>
          <div class="ticket-time" style="font-size:12px;color:var(--txt3);margin-top:2px">${ord.time||''}</div>
        </div>
      </div>
      <div class="ticket-items-wrap" style="padding:14px 20px">
        ${(ord.items||[]).map(it=>`<div class="t-row" style="display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--brd)">
          <span class="ticket-item-qty" style="font-size:32px;font-weight:700;font-family:var(--mono);color:var(--acc);min-width:40px;line-height:1">${it.qty}</span>
          <span class="ticket-item-name" style="font-size:22px;font-weight:500;color:var(--txt);line-height:1.2">${it.name}</span>
        </div>`).join('')}
      </div>
      <div class="ticket-actions">
        ${ord.status==='new'?`<button class="tact-btn prep" onclick="updateStatus('${oid}','prep')"><i class="ti ti-flame" aria-hidden="true"></i>En cuisine</button>`:''}
        ${ord.status==='prep'?`<button class="tact-btn done" onclick="updateStatus('${oid}','done')"><i class="ti ti-check" aria-hidden="true"></i>Servi</button>`:''}
        <button class="tact-btn cancel" onclick="updateStatus('${oid}','done')"><i class="ti ti-x" aria-hidden="true"></i>Annuler</button>
      </div>
    </div>`;
  }).join('');
}

window.updateStatus = async function(id, status) {
  await update(ref(db, 'orders/' + id), { status });
};

// ---- CARTE ----
function renderCarte() {
  const el = document.getElementById('carte-scroll');
  if (!menuData.categories) { el.innerHTML=''; return; }
  const cats = Object.entries(menuData.categories).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  let html = '';
  cats.forEach(([cid, cat]) => {
    const dishes = Object.entries(menuData.dishes||{}).filter(([,d])=>d.catId===cid);
    html += `<div class="cat-section">
      <div class="cat-head">
        <span class="cat-name">${cat.name}</span>
        <button class="cat-edit-btn" onclick="openCatModal('${cid}')" aria-label="Modifier catégorie"><i class="ti ti-pencil" aria-hidden="true"></i></button>
        <button class="cat-edit-btn" onclick="deleteCat('${cid}')" aria-label="Supprimer catégorie" style="color:var(--txt3)"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
      ${dishes.map(([did,d])=>`<div class="dish-row">
        <div class="dish-info">
          <div class="dish-name-txt">${d.name}</div>
          ${d.desc?`<div class="dish-desc-txt">${d.desc}</div>`:''}
        </div>
        <div class="dish-price-txt">${fmt(d.price)}</div>
        <div class="dish-actions">
          <button class="dish-act-btn" onclick="toggleDish('${did}')" title="${d.available?'Disponible':'Indisponible'}" aria-label="Disponibilité">
            <i class="ti ${d.available?'ti-eye':'ti-eye-off'}" style="color:${d.available?'var(--green)':'var(--txt3)'}" aria-hidden="true"></i>
          </button>
          <button class="dish-act-btn" onclick="openDishModal('${did}')" aria-label="Modifier"><i class="ti ti-pencil" aria-hidden="true"></i></button>
          <button class="dish-act-btn danger" onclick="deleteDish('${did}')" aria-label="Supprimer"><i class="ti ti-trash" aria-hidden="true"></i></button>
        </div>
      </div>`).join('')}
      <button class="cat-add-btn" onclick="openDishModal(null,'${cid}')"><i class="ti ti-plus" aria-hidden="true"></i>Ajouter un plat</button>
    </div>`;
  });
  el.innerHTML = html;
}

window.toggleDish = async function(id) {
  const d = menuData.dishes[id];
  if (!d) return;
  await update(ref(db, 'menu/dishes/' + id), { available: !d.available });
  showNotif(d.available ? 'Plat masqué' : 'Plat disponible');
};

window.deleteDish = async function(id) {
  if (!confirm('Supprimer ce plat ?')) return;
  await remove(ref(db, 'menu/dishes/' + id));
};

window.deleteCat = async function(id) {
  if (!confirm('Supprimer cette catégorie et ses plats ?')) return;
  await remove(ref(db, 'menu/categories/' + id));
  const toDelete = Object.entries(menuData.dishes||{}).filter(([,d])=>d.catId===id);
  for (const [did] of toDelete) await remove(ref(db, 'menu/dishes/' + did));
};

// ---- MODALS ----
window.openDishModal = function(dishId, defCatId) {
  const d = dishId ? menuData.dishes[dishId] : null;
  const catOptions = Object.entries(menuData.categories||{})
    .map(([cid,c])=>`<option value="${cid}"${(d?d.catId:defCatId)===cid?' selected':''}>${c.name}</option>`).join('');
  document.getElementById('modal-title').textContent = d ? 'Modifier le plat' : 'Nouveau plat';
  document.getElementById('modal-fields').innerHTML = `
    <div class="modal-field"><label>Nom</label><input id="mf-name" value="${d?d.name:''}" placeholder="Nom du plat"></div>
    <div class="modal-field"><label>Description</label><textarea id="mf-desc" placeholder="Ingrédients...">${d?d.desc:''}</textarea></div>
    <div class="modal-row">
      <div class="modal-field"><label>Prix (€)</label><input id="mf-price" type="number" step="0.5" min="0" value="${d?d.price:''}"></div>
      <div class="modal-field"><label>Catégorie</label><select id="mf-cat">${catOptions}</select></div>
    </div>`;
  document.getElementById('modal-actions').innerHTML = `
    ${d?`<button class="modal-delete" onclick="deleteDish('${dishId}');closeModal()">Supprimer</button>`:''}
    <button class="modal-cancel" onclick="closeModal()">Annuler</button>
    <button class="modal-save" onclick="saveDish('${dishId||''}')">Enregistrer</button>`;
  document.getElementById('modal-bg').style.display = 'flex';
};

window.saveDish = async function(id) {
  const name = document.getElementById('mf-name').value.trim();
  const desc = document.getElementById('mf-desc').value.trim();
  const price = parseFloat(document.getElementById('mf-price').value)||0;
  const catId = document.getElementById('mf-cat').value;
  if (!name) { showNotif('Nom requis'); return; }
  if (id) {
    await update(ref(db, 'menu/dishes/' + id), { name, desc, price, catId });
  } else {
    await push(ref(db, 'menu/dishes'), { catId, name, desc, price, available: true });
  }
  closeModal();
  showNotif('Sauvegardé');
};

window.openCatModal = function(catId) {
  const c = catId ? menuData.categories[catId] : null;
  document.getElementById('modal-title').textContent = c ? 'Modifier la catégorie' : 'Nouvelle catégorie';
  document.getElementById('modal-fields').innerHTML = `<div class="modal-field"><label>Nom</label><input id="mf-catname" value="${c?c.name:''}" placeholder="Entrées, Plats..."></div>`;
  document.getElementById('modal-actions').innerHTML = `
    ${c?`<button class="modal-delete" onclick="deleteCat('${catId}');closeModal()">Supprimer</button>`:''}
    <button class="modal-cancel" onclick="closeModal()">Annuler</button>
    <button class="modal-save" onclick="saveCat('${catId||''}')">Enregistrer</button>`;
  document.getElementById('modal-bg').style.display = 'flex';
};

window.saveCat = async function(id) {
  const name = document.getElementById('mf-catname').value.trim();
  if (!name) { showNotif('Nom requis'); return; }
  if (id) {
    await update(ref(db, 'menu/categories/' + id), { name });
  } else {
    const order = Object.keys(menuData.categories||{}).length;
    await push(ref(db, 'menu/categories'), { name, order });
  }
  closeModal();
  showNotif('Sauvegardé');
};

window.closeModal = function() { document.getElementById('modal-bg').style.display='none'; };
window.closeModalBg = function(e) { if(e.target===document.getElementById('modal-bg')) closeModal(); };

// ---- UTILS ----
function clock() {
  const el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

let notifTimer;
window.showNotif = function(msg) {
  document.querySelectorAll('.notif').forEach(x=>x.remove());
  clearTimeout(notifTimer);
  const el = document.createElement('div');
  el.className='notif'; el.textContent=msg;
  document.body.appendChild(el);
  notifTimer = setTimeout(()=>el.remove(), 2000);
};

// ---- START ----
const params = new URLSearchParams(window.location.search);
const isTVMode = params.has('cuisine') || window.location.hash === '#cuisine' || window.location.search.includes('cuisine');
if (isTVMode) {
  document.body.classList.add('tv-mode');
  document.title = 'Cuisine — RestoPOS';
  // Also force active view to cuisine
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const cv = document.getElementById('view-cuisine');
  if (cv) cv.classList.add('active');
}

init().catch(err => {
  document.getElementById('loader').innerHTML = `<div style="color:var(--red);text-align:center;padding:20px"><i class="ti ti-wifi-off" style="font-size:40px;display:block;margin-bottom:12px"></i>Erreur de connexion Firebase<br><small style="color:var(--txt3);margin-top:8px;display:block">${err.message}</small></div>`;
});
</script>
</body>
</html>
